name: VirtualLoc
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  VirtualLoc:
    type: application
    platform: iOS
    sources:
      - path: VirtualLoc
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Teleo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: 用於取得你的原始位置，並在背景維持 App 運作
        NSLocalNetworkUsageDescription: 用於透過本機 VPN 連線到這支手機的開發者服務，以及尋找無線配對服務
        NSBonjourServices:
          - _remotepairing._tcp.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.virtualloc
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: VirtualLoc/Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/ThirdParty/idevice"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/ThirdParty/idevice"
        OTHER_LDFLAGS: "-lidevice_ffi -lc++ -lz -lresolv"
        ENABLE_BITCODE: NO
